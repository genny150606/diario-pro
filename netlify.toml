[build]
  command = "cd api && npm install" # Ensure API deps are installed
  publish = "."
  functions = "api"

[dev]
  command = "node api/index.js"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


